<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - AI Document Screening System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="logo-title">
      <span class="badge">SSB</span>
      <h1>Analytics Dashboard</h1>
    </div>
    <nav>
      <a href="index.html">Screen Document</a>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="qr.html">QR Verify</a>
      <a href="report.html">Reports</a>
    </nav>
  </header>

  <main class="container">

    <div class="stats-grid">
      <div class="card">
        <p class="hint">Total Screened</p>
        <div class="stat-number" id="totalScreened">--</div>
      </div>
      <div class="card">
        <p class="hint">High Risk</p>
        <div class="stat-number" id="highRiskCount">--</div>
      </div>
      <div class="card">
        <p class="hint">Low Risk</p>
        <div class="stat-number" id="lowRiskCount">--</div>
      </div>
      <div class="card">
        <p class="hint">Tampered Documents</p>
        <div class="stat-number" id="tamperedCount">--</div>
      </div>
    </div>

    <div class="card">
      <h3>Risk Distribution</h3>
      <div class="bar-chart" id="barChart">
        <!-- bars are injected by JS -->
      </div>
    </div>

    <div class="card">
      <h3>Recent Records</h3>
      <table style="width:100%; border-collapse: collapse;" id="recordsTable">
        <thead>
          <tr>
            <th style="text-align:left; padding:8px; border-bottom:1px solid #ddd;">Passport No.</th>
            <th style="text-align:left; padding:8px; border-bottom:1px solid #ddd;">Name</th>
            <th style="text-align:left; padding:8px; border-bottom:1px solid #ddd;">Risk Level</th>
            <th style="text-align:left; padding:8px; border-bottom:1px solid #ddd;">Date</th>
          </tr>
        </thead>
        <tbody id="recordsBody">
        </tbody>
      </table>
    </div>

  </main>

  <footer>
    <p>SIH PS 26188 &mdash; Ministry of Home Affairs, Sashastra Seema Bal (SSB)</p>
  </footer>

  <script>
    const BACKEND_URL = "http://localhost:8000";

    async function loadStats() {
      try {
        const res = await fetch(`${BACKEND_URL}/stats`);
        const stats = await res.json();

        document.getElementById("totalScreened").textContent = stats.total_screened ?? 0;
        document.getElementById("highRiskCount").textContent = stats.high_risk_count ?? 0;
        document.getElementById("lowRiskCount").textContent = stats.low_risk_count ?? 0;
        document.getElementById("tamperedCount").textContent = stats.tampered_count ?? 0;

        renderBarChart(stats);
      } catch (err) {
        console.error("Failed to load stats:", err);
      }
    }

    function renderBarChart(stats) {
      const barChart = document.getElementById("barChart");
      barChart.innerHTML = "";

      const data = [
        { label: "Low", value: stats.low_risk_count ?? 0, color: "#2e7d32" },
        { label: "Medium", value: stats.medium_risk_count ?? 0, color: "#f9a825" },
        { label: "High", value: stats.high_risk_count ?? 0, color: "#d32f2f" },
      ];

      const maxValue = Math.max(1, ...data.map((d) => d.value));

      data.forEach((d) => {
        const heightPct = (d.value / maxValue) * 100;

        const wrap = document.createElement("div");
        wrap.className = "bar-wrap";

        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.height = heightPct + "%";
        bar.style.background = d.color;
        bar.innerHTML = `<span>${d.value}</span>`;

        const label = document.createElement("div");
        label.className = "bar-label";
        label.textContent = d.label;

        wrap.appendChild(bar);
        wrap.appendChild(label);
        barChart.appendChild(wrap);
      });
    }

    async function loadRecords() {
      try {
        const res = await fetch(`${BACKEND_URL}/records`);
        const records = await res.json();

        const tbody = document.getElementById("recordsBody");
        tbody.innerHTML = "";

        records.slice(0, 20).forEach((r) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td style="padding:8px; border-bottom:1px solid #eee;">${r.passport_number || "--"}</td>
            <td style="padding:8px; border-bottom:1px solid #eee;">${r.name || "--"}</td>
            <td style="padding:8px; border-bottom:1px solid #eee;">${r.risk_level || "--"}</td>
            <td style="padding:8px; border-bottom:1px solid #eee;">${r.created_at || "--"}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Failed to load records:", err);
      }
    }

    loadStats();
    loadRecords();
  </script>

</body>
</html>
